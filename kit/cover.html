<style>
#card2{display:none} /* detail card dropped from the scorecard (Sheila, Oct 14) */
#card1 .callouts{display:none} /* funnel card: no win of the day / one fix (Sheila, Oct 14); the cover carries them */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{border-radius:10px;padding:12px 10px 12px 11px;border:1px solid var(--line);border-left:6px solid var(--ink3);min-width:0;display:flex;flex-direction:column;gap:6px}
.kpi.hit{border-left-color:var(--good);background:var(--good-soft)}
.kpi.miss{border-left-color:var(--bad);background:var(--bad-soft)}
.kpi{--yel:#e3a800;--yel-ink:#946c00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kpi{--yel-ink:#f2c94c}}
:root[data-theme="dark"] .kpi{--yel-ink:#f2c94c}
.kpi.close{border-left-color:var(--yel);background:color-mix(in srgb,#f5c400 20%,var(--card))}
.kpi.track{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.kpi.none{border-left-color:var(--ink3)}
.kpi .nm{font-size:12.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.kpi.hit .v{color:var(--good)} .kpi.miss .v{color:var(--bad)} .kpi.close .v{color:var(--yel-ink)} .kpi.track .v{color:var(--accent)} .kpi.none .v{color:var(--ink3)}
.kpi .of{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;flex:1}
.kpi .of ul.pl{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:2px}
.kpi .nt{font-size:10.5px;line-height:1.3;color:var(--ink3);margin-top:-3px}
.kpi .tbar{position:relative;height:6px;background:var(--track);border-radius:3px}
.kpi .tbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.kpi.hit .tbar i{background:var(--good)} .kpi.miss .tbar i{background:var(--bad)} .kpi.close .tbar i{background:var(--yel)}
.kpi .tbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.kpi .st{display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:11.5px;color:var(--ink2);white-space:nowrap}
.kpi .pill{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:999px;color:#fff}
.kpi.hit .pill{background:var(--good)} .kpi.miss .pill{background:var(--bad)} .kpi.close .pill{background:var(--yel);color:#2b2000} .kpi.track .pill{background:var(--accent);color:var(--card)} .kpi.none .pill{background:var(--ink3);color:var(--card)}
/* priority tiles are a little bigger; the show rate tile carries the handoff steps */
.pri .kpis{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}
.pri .kpi{padding:14px 12px 14px 13px}
.pri .kpi.k-show{grid-column:2;grid-row:1/span 2}
.pri .kpi .v{font-size:36px}
.kpi .all{border-top:1px solid color-mix(in srgb,var(--ink3) 30%,transparent);padding-top:8px;display:flex;flex-direction:column;gap:2px}
.kpi .all .al{font-size:12.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.kpi .all .av{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.kpi .all .av span{font-size:14px;font-weight:600;letter-spacing:0;color:var(--ink2);margin-left:10px}
.kpi .steps{display:flex;flex-direction:column;gap:3px;font-size:12px}
.kpi .steps .sh{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.kpi .steps div.r{display:flex;justify-content:space-between;gap:6px}
.kpi .steps div.r span:last-child{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .steps .ok{color:var(--good)} .kpi .steps .no{color:var(--bad)} .kpi .steps .na{color:var(--ink3);font-weight:600!important}
/* the card's day, step by step, in the empty top half of the show rate tile (Sheila, Nov 6, 2026) */
.kpi.k-show .of{flex:none}
.kpi .day{display:flex;flex-direction:column;gap:5px;font-size:12.5px;margin:4px 0 auto;padding-bottom:8px}
.kpi .day .sh{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.kpi .day div.r{display:flex;justify-content:space-between;gap:6px}
.kpi .day div.r span:last-child{font-weight:800;white-space:nowrap}
.kpi .day .who{font-size:11px;color:var(--bad);margin-top:-4px}
.kpi .day .ok{color:var(--good)} .kpi .day .no{color:var(--bad)} .kpi .day .na{color:var(--ink3);font-weight:600!important}
.comp h2{color:var(--ink2)}
.bl{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:12px}
.bl .callout{display:flex;flex-direction:column;gap:6px}
.closes{display:flex;align-items:baseline;gap:10px;border-top:1px solid color-mix(in srgb,var(--good) 25%,transparent);padding-top:8px;margin-top:4px}
.closes + .closes{border-top:0;padding-top:0;margin-top:0}
.closes .n{font-size:40px;font-weight:800;color:var(--good);line-height:1;font-variant-numeric:tabular-nums}
.closes .t{font-size:14px;font-weight:600;color:var(--ink2)}
.fixes{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.fixes li{font-size:14px;font-weight:600}
.fixes li b{font-weight:800}
@media (max-width:560px){.kpis{grid-template-columns:1fr 1fr}.pri .kpis{grid-template-columns:1fr}.pri .kpi.k-show{grid-column:auto;grid-row:auto}.bl{grid-template-columns:1fr}}
.grp{margin-top:14px}
.grp h3{margin:0 0 6px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.kpis.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis.one{grid-template-columns:1fr}
#g1{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr)}
.bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:8px;margin-top:14px}
.bottom .col{display:flex;flex-direction:column;gap:8px}
.bottom .col .kpi{flex:1}
.bottom h3{margin:0 0 6px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.bottom .kpi.k-show{height:100%;box-sizing:border-box}
.bottom .kpi.k-show .v{font-size:36px}
.hc{display:flex;flex-direction:column;gap:3px;margin:2px 0 2px}
.hc .bars{display:flex;align-items:flex-end;gap:2px;height:64px}
.hc .b{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border-radius:3px}
.hc .b.on{background:color-mix(in srgb,var(--accent) 22%,#fff)}
.hc .b i{display:block;width:70%;background:var(--accent);border-radius:2px 2px 0 0}
.hc .b em{font-style:normal;font-size:9.5px;font-weight:800;color:var(--ink2);line-height:1.2}
.hc .ax{display:flex;gap:2px}
.hc .ax span{flex:1;text-align:center;font-size:9px;color:var(--ink3);white-space:nowrap}
.hc .lg{display:flex;gap:10px;font-size:10px;color:var(--ink3);align-items:center}
.hc .lg s{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px;text-decoration:none}
@media (max-width:560px){#g1{grid-template-columns:1fr}.bottom{grid-template-columns:1fr}}
/* Nov 16, 2026 (Sheila): no wins/fixes; sets and closes so far under the title; the three draw KPIs on top,
   the rest smaller at the bottom; the handoff tile replaces the show rate tile */
.big2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.big2 .b2{display:flex;align-items:baseline;gap:10px;border-radius:12px;background:var(--good-soft);padding:10px 14px}
.big2 .n{font-size:40px;font-weight:800;color:var(--good);line-height:1;font-variant-numeric:tabular-nums}
.big2 .t{font-size:14px;font-weight:600;color:var(--ink2)}
#gtop{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:stretch}
#gtop .stk{display:flex;flex-direction:column;gap:8px}
#gtop .kpi .v{font-size:36px}
.kpi.k-handoff .v{font-size:30px!important}
.kpi .shw{font-size:12px;color:var(--ink2);border-top:1px solid color-mix(in srgb,var(--ink3) 45%,transparent);padding-top:8px;margin-top:4px}
.kpi .shw .sh{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
.rest{margin-top:14px}
#grest{grid-template-columns:repeat(3,minmax(0,1fr))}
#grest .kpi{padding:9px 9px 9px 10px;gap:4px}
#grest .kpi .v{font-size:22px}
#grest .kpi .of{font-size:11.5px}
#grest .kpi .nm{font-size:11px}
@media (max-width:560px){#gtop,#grest{grid-template-columns:1fr}.big2{grid-template-columns:1fr}}
/* $1,000 draw box (Sheila, Nov 16, 2026): Jose and Jordan, Nov 16 to Nov 29 */
.draw{border-radius:12px;border:2px solid var(--bad);background:var(--bad-soft);padding:12px 14px;margin:0 0 12px;display:flex;flex-direction:column;gap:8px}
.draw.met{border-color:var(--good);background:var(--good-soft)}
.draw .dh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.draw .dt{font-size:20px;font-weight:800;letter-spacing:-.01em;color:var(--bad)}
.draw.met .dt{color:var(--good)}
.draw .wk{font-size:13px;font-weight:700;color:var(--ink2)}
.draw .ck{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.draw .c{border-radius:8px;background:var(--card);padding:7px 9px;border-left:5px solid var(--bad)}
.draw .c.ok{border-left-color:var(--good)} .draw .c.na{border-left-color:var(--ink3)}
.draw .c .n{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.draw .c .s{font-size:15px;font-weight:800;color:var(--bad)} .draw .c.ok .s{color:var(--good)} .draw .c.na .s{color:var(--ink3);font-size:13px}
.draw .c .t{font-size:11px;color:var(--ink3)}
.draw ul{margin:0;padding-left:18px;font-size:13.5px;font-weight:600;display:flex;flex-direction:column;gap:3px}
.draw .rule{font-size:13px;color:var(--ink2)} .draw .rule b{color:var(--ink)}
.draw .wc{font-size:13px;font-weight:700;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.draw .wc span{font-size:17px;font-weight:800;color:var(--ink)}
.draw .wc.y{border-color:var(--good)} .draw .wc.y span{color:var(--good)} .draw .wc.n{border-color:var(--bad)} .draw .wc.n span{color:var(--bad)}
.draw .wf{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.draw .ws{font-size:13px;color:var(--ink2)} .draw .ws b{color:var(--ink)}
.draw .days{display:flex;gap:4px;flex-wrap:wrap}
.draw .days span{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--card);color:var(--ink3);border:1px solid var(--line)}
.draw .days span.y{background:var(--good);color:#fff;border-color:var(--good)} .draw .days span.n{background:var(--bad);color:#fff;border-color:var(--bad)}
@media (max-width:560px){.draw .ck{grid-template-columns:1fr}}
/* Nov 20, 2026 (Sheila): Jose's Incomplete Typeform card, tracked only (build.py CARDS) */
.cnote{font-size:12.5px;color:var(--ink2);border:1px dashed var(--ink3);border-radius:10px;padding:8px 12px;margin:0 0 12px}
.cnote b{color:var(--ink)}
</style>

<div class="card" id="card0">
  <header>
    <div class="eyebrow" id="c0eye">Welcome Series Outbound</div>
    <h1 id="c0title"></h1>
    <div class="meta" id="c0meta"></div>
  </header>
  <div class="big2">
    <div class="b2"><div class="n" id="c0setsn"></div><div class="t" id="c0setst"></div></div>
    <div class="b2"><div class="n" id="c0closes"></div><div class="t" id="c0closest"></div></div>
  </div>
  <div class="draw" id="c0draw" style="display:none"></div>
  <div class="cnote" id="c0note" style="display:none"></div>
  <section>
    <h2 id="c0toph">Draw KPIs: hit all 3 for a qualifying day</h2>
    <div class="kpis" id="gtop"></div>
  </section>
  <section class="rest">
    <h2>Other numbers</h2>
    <p class="lead" id="c0restp">Tracked, not part of the draw. Green: hit. Yellow: almost. Red: missed. Blue: no target.</p>
    <div class="kpis" id="grest"></div>
  </section>
</div>

<script>
(function(){
  var D=JSON.parse(document.getElementById('scorecard-data').textContent), C=D.cover, m=D.metrics;
  var $=function(id){return document.getElementById(id)};
  var p=m.date.split('-'), dd=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
  var CD=D.card||null;   // Nov 20, 2026 (Sheila): another card's labels (build.py CARDS), e.g. Jose's Incomplete Typeform card
  if(CD){$('c0eye').textContent=CD.eyebrow; $('c0toph').textContent=CD.top; $('c0restp').textContent=CD.rest;
    if(CD.note){$('c0note').innerHTML=CD.note; $('c0note').style.display=''}}
  $('c0title').textContent=D.setter.name+"'s "+(CD?CD.day:'Day')+": "+dd.toLocaleDateString('en-US',{timeZone:'UTC',weekday:'long',month:'short',day:'numeric'});
  var K={}; C.kpis.forEach(function(k){K[k.key]=k}); var T={}; (C.track||[]).forEach(function(k){T[k.key]=k});
  $('c0meta').textContent=m.dials+' dials to '+m.people_dialed+' leads'+(T.phone?' · '+T.phone.value+' on the phone':'')+' · '+m.first_call+' to '+m.last_call+' ET';
  var since=D.setter.since;   // already a label, e.g. "Oct 20" (build.py setter())
  $('c0setsn').textContent=C.sets==null?'–':C.sets; $('c0setst').textContent=(C.sets===1?'set':'sets')+' to a closer'+(CD&&CD.sets_from?CD.sets_from:'')+' since '+since;
  $('c0closes').textContent=C.closes; $('c0closest').textContent=(C.closes===1?'close':'closes')+' since '+since+(C.closes_names?': '+C.closes_names:'');
  var PILL={hit:'Hit',close:'Almost',miss:'Missed',none:'None due'};
  function tile(k){
    if(!k) return '';
    var u=k.unit==='%'?'%':'', v=(k.extra&&k.extra.big)||(k.value==null?'–':k.value+u);
    var w=Math.min(100,k.value||0), t=k.target;
    var x=k.extra||{}, head='<div class="nm">'+k.name+'</div><div class="v">'+v+'</div>'+(k.note?'<div class="nt">'+k.note+'</div>':'')+(k.detail?'<div class="of">'+k.detail+'</div>':'');
    var inner=head;
    if(k.key==='speed' && m.hours) inner=head.replace('<div class="of">', chart()+'<div class="of">');
    if(x.day){
      var dl=dd.toLocaleDateString('en-US',{timeZone:'UTC',weekday:'short',month:'short',day:'numeric'});
      inner+='<div class="day"><div class="sh">'+(k.key==='handoff'?'Due on ':'Handoff steps on ')+dl+'</div>'+x.day.map(function(s){
        var cls=!s.due?'na':(s.done===s.due?'ok':'no');
        var val=!s.due?'None due':(s.due>1?s.done+' of '+s.due+' done':(s.done?'Done':'Missed'));
        return '<div class="r"><span>'+s.name+'</span><span class="'+cls+'">'+val+'</span></div>'+
          (s.missed.length?'<div class="who">Missed: '+s.missed.join(', ')+'</div>':'')}).join('')+'</div>';
    }
    if(x.all) inner+='<div class="all">'+x.all+'</div>';
    if(x.steps){
      inner+='<div class="steps"><div class="sh">'+x.steps_head+'</div>'+x.steps.map(function(s){
        var cls=s.due?(s.done===s.due?'ok':'no'):'na', val=s.due?s.done+' of '+s.due:'none due yet';
        return '<div class="r"><span>'+s.name+'</span><span class="'+cls+'">'+val+'</span></div>'}).join('')+'</div>';
    }
    return '<div class="kpi k-'+k.key+' '+k.status+'">'+inner+
      '<div class="tbar"><i style="width:'+w+'%"></i><b style="left:calc('+t+'% - 1px)"></b></div>'+
      '<div class="st"><span>Target '+k.target+u+'</span><span class="pill">'+(x.pill||PILL[k.status])+'</span></div>'+
      (x.show?'<div class="shw"><div class="sh">Tracked, no target</div>'+x.show+'</div>':'')+'</div>'}
  // new sign-ups by hour that day (solid bars) and the hours you were dialing (light blue), 9am to 9pm ET
  function chart(){
    var H=m.hours.filter(function(x){return x.h>=9&&x.h<21}), mx=Math.max.apply(null,H.map(function(x){return x.signups}).concat([1]));
    var lab=function(h){return (h%12||12)+(h<12?'am':'pm')};
    return '<div class="hc"><div class="bars">'+H.map(function(x){
      return '<div class="b'+(x.calls?' on':'')+'">'+(x.signups?'<em>'+x.signups+'</em>':'')+'<i style="height:'+Math.round(46*x.signups/mx)+'px"></i></div>'}).join('')+
      '</div><div class="ax">'+H.map(function(x,i){return '<span>'+(i%2===0?lab(x.h):'')+'</span>'}).join('')+'</div>'+
      '<div class="lg"><span><s style="background:var(--accent)"></s>New sign-ups</span><span><s style="background:color-mix(in srgb,var(--accent) 22%,#fff)"></s>Hours you dialed</span></div></div>'}
  function track(k){
    if(!k) return '';
    return '<div class="kpi track"><div class="nm">'+k.name+'</div>'+
      '<div class="v">'+k.value+'</div><div class="of">'+k.detail+'</div>'+
      '<div class="st"><span>No target</span><span class="pill">Tracking</span></div></div>'}
  var leadsT=(CD&&CD.leads_track&&K.leads)?track({name:K.leads.name,value:K.leads.value,detail:K.leads.detail}):tile(K.leads);
  $('gtop').innerHTML='<div class="stk">'+tile(K.speed)+leadsT+'</div>'+tile(K.handoff||K.show);
  // 3 + 3 (Sheila, Nov 16): pickup, connect, set to a closer; voicemail, text, double dial. Time on the phone moves to the line under the title.
  $('grest').innerHTML=tile(K.pickup)+tile(K.connect)+track(T.closer)+['vm','text','dd'].map(function(x){return tile(K[x])}).join('');
  // $1,000 draw box (Sheila, Nov 16, 2026)
  var W=D.draw;
  if(W){
    var b=$('c0draw'); b.style.display=''; if(W.met) b.className='draw met';
    // Wording (Sheila, Nov 16, 2026): a day with all 3 KPIs hit is a "qualifying day"; 5 qualifying days in a week
    // (Mon to Sun) make the setter eligible for that week's $1,000 draw.
    // no dollar amount on the card (Sheila, Nov 16, 2026): just "the draw"
    var h='<div class="rule"><b>The draw:</b> hit all 3 KPIs on '+W.needed+' of the 7 days this week (Mon to Sun) to be eligible.</div>';
    h+='<div class="dh"><div class="dt">'+(W.met?'Today is a qualifying day':'Today is not a qualifying day')+'</div>';
    var wst='';
    if(W.week){
      var w=W.week, need=Math.max(w.needed-w.met,0), end=new Date(w.end+'T12:00:00Z').toLocaleDateString('en-US',{timeZone:'UTC',weekday:'short',month:'short',day:'numeric'});
      var wcls=need===0?'y':(need>w.days_left?'n':'');
      h+='<div class="wc '+wcls+'"><span>'+w.met+' of '+w.needed+'</span> qualifying days this week</div>';
      wst=need===0?'<b>Eligible for this week\'s draw.</b>':
          (need>w.days_left?'<b>Not eligible this week:</b> '+need+' more qualifying days needed, only '+w.days_left+' days left.':
           'Need <b>'+need+' more</b> qualifying '+(need===1?'day':'days')+' by '+end+' to be eligible'+(w.days_left<=2?' (a weekend day counts if you dial)':'')+'.');
    }
    h+='</div><div class="ck">'+W.checks.map(function(c){
      var cls=!c.owed?'na':(c.met?'ok':'');
      return '<div class="c '+cls+'"><div class="n">'+c.name+'</div><div class="s">'+(c.owed?(c.met?'Hit: ':'Missed: '):'')+c.shown+'</div><div class="t">Needs '+c.target+(c.owed?'':' · nothing owed, counts as hit')+'</div></div>'}).join('')+'</div>';
    if(W.week){
      h+='<div class="wf"><div class="days">'+W.week.days.map(function(x){var q=new Date(x.date+'T12:00:00Z');
        return '<span class="'+(x.met?'y':'n')+'">'+q.toLocaleDateString('en-US',{timeZone:'UTC',weekday:'short'})+(x.met?' qualifying':' not qualifying')+'</span>'}).join('')+'</div><div class="ws">'+wst+'</div></div>';
    }
    b.innerHTML=h;
  }
})();
</script>
